<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pledge Reports - Embsys</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #1f2937;
      --muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.10);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page { width: min(960px, calc(100% - 28px)); margin: 28px auto 48px; }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 14px 20px;
    }
    .header img { height: 40px; object-fit: contain; }
    .headerTitle { flex: 1; min-width: 0; }
    h1 { margin: 0; font-size: 20px; font-weight: 800; }
    .sub { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .backLink {
      flex: none;
      padding: 9px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
    }
    .backLink:hover { background: var(--surface-2); border-color: var(--text); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 20px;
    }
    input[type="search"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      background: var(--surface);
      font-size: 15px;
    }
    input[type="search"]:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
    .reportList { display: grid; gap: 10px; margin-top: 16px; }
    .reportItem {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
    }
    .reportItem:hover { border-color: var(--border-strong); }
    .pledgeId { font-size: 17px; font-weight: 800; overflow-wrap: anywhere; }
    .meta { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .button {
      display: inline-block;
      min-width: 150px;
      padding: 10px 14px;
      border-radius: 9px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 13.5px;
      text-align: center;
      text-decoration: none;
    }
    .button:hover { background: var(--primary-hover); }
    .button.video { background: var(--success); }
    .button.video:hover { background: #15803d; }
    .empty { padding: 24px 8px 8px; color: var(--muted); text-align: center; }
    .error { padding: 18px 8px 4px; color: var(--danger); text-align: center; font-weight: 600; }
    @media (max-width: 650px) {
      .reportItem { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; }
      .button { flex: 1; }
      .backLink { padding: 8px 10px; font-size: 12.5px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <img src="/webui/embsys_logo.png" alt="Embsys Logo" />
      <div class="headerTitle">
        <h1>Pledge Reports</h1>
        <p class="sub">Completed reports are listed with the most recently added first.</p>
      </div>
      <a class="backLink" href="/">&larr; Back to Workbench</a>
    </header>

    <section class="card">
      <input type="search" id="reportSearch" placeholder="Search by Pledge ID" aria-label="Search reports by Pledge ID" />
      <div id="reportList" class="reportList"></div>
      <div id="message" class="empty">Loading reports...</div>
    </section>
  </main>

  <script>
    const reportList = document.getElementById("reportList");
    const reportSearch = document.getElementById("reportSearch");
    const message = document.getElementById("message");
    let reports = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderReports() {
      const query = reportSearch.value.trim().toLowerCase();
      const visibleReports = reports.filter((report) =>
        String(report.pledge_id || "").toLowerCase().includes(query)
      );
      reportList.innerHTML = visibleReports.map((report) => `
        <article class="reportItem">
          <div>
            <div class="pledgeId">${escapeHtml(report.pledge_id)}</div>
            <div class="meta">Added: ${escapeHtml(report.started_at || "Unknown")} &middot; Jewels: ${Number(report.jewel_count || 0)}</div>
          </div>
          <div class="actions">
            <a class="button" href="${escapeHtml(report.pdf_url)}" download>Download PDF</a>
            ${report.video_url ? `<a class="button video" href="${escapeHtml(report.video_url)}" download>Download Video</a>` : ""}
          </div>
        </article>
      `).join("");
      message.textContent = reports.length
        ? "No reports match this Pledge ID."
        : "No completed reports are available yet.";
      message.style.display = visibleReports.length ? "none" : "block";
    }

    async function loadReports() {
      try {
        const response = await fetch("/api/reports", { cache: "no-store" });
        const data = await response.json();
        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Could not load reports.");
        }
        reports = data.reports || [];
        renderReports();
      } catch (error) {
        reportList.innerHTML = "";
        message.className = "error";
        message.textContent = error.message || "Could not load reports.";
      }
    }

    reportSearch.addEventListener("input", renderReports);
    loadReports();
  </script>
</body>
</html>
